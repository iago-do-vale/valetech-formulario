<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Valetech</title>
</head>
<body>

    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="" method="get">

            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="userName">Nome</label>
                <input type="text" id="userName" name="userName" required>
                <br>

                <label for="age">Idade</label>
                <input type="number" id="age" name="age" min="12" max="100" required>
                <br>

                <label for="birthDate">Data de Nascimento</label>
                <input type="date" id="birthDate" name="birthDate">
                <br>

                <label for="userEmail">Email</label>
                <input type="email" id="userEmail" name="userEmail" required>
                <br>

                <label for="userTelephone">Telefone</label>
                <input type="tel" id="userTelephone" name="userTelephone" pattern="[0-9]{11}" placeholder="DDD + Número">
                <br>

                <label for="userImg">Foto de Perfil</label>
                <input type="file" id="userImg" name="userImg" accept="image/*">
                <br>

            </fieldset>

            <fieldset>

                <legend>Perfil</legend>

                <p>Gênero</p>

                <input type="radio" id="female" name="userGender" value="Feminino">
                <label for="female">Feminino</label>

                <input type="radio" id="male" name="userGender" value="Masculino">
                <label for="male">Masculino</label>

                <input type="radio" id="notInformed" name="userGender" value="Notinformed">
                <label for="notInformed">Não informar</label>

                <br>

                <label for="estadoCivil">Estado Civil:</label>

                <select id="estadoCivil" name="estadoCivil">
                    <option value="nothing">Selecione...</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="casado">Casado</option>
                    <option value="divorciado">Divorciado</option>
                </select>

                <br>

                <label for="userState">Estado:</label>

                <select id="userState" name="estado">
                    <option value="">Selecione um estado</option>

                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <br>

            </fieldset>

            <fieldset>

                <legend>Hábitos</legend>

                <label for="userCity">Digite sua cidade:</label>
                <input type="text" id="userCity" name="userCity">

                <br>

                <input type="checkbox" id="instagram">
                <label for="instagram">Instagram</label>

                <br>

                <input type="checkbox" id="x">
                <label for="x">X</label>

                <br>

                <input type="checkbox" id="linkedin">
                <label for="linkedin">LinkedIn</label>

                <br>

                <input type="checkbox" id="whatsapp">
                <label for="whatsapp">Whatsapp</label>
                <br>
                
                <label for="musicGenre">Gosto Musical:</label>
                <input 
                    type="text"
                    id="musicGenre"
                    name="musicGenre"
                    list="musicOptions"
                    placeholder="Digite ou selecione um gênero"
                >
                <datalist id="musicOptions">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Kpop">
                    <option value="Funk">
                </datalist>
                <br>

                <label for="colorFav">Cor Favorita</label>
                <input type="text" name="colorFav" id="colorFav" list="colors">

                <datalist id="colors">
                    <option value="azul">
                    <option value="roxo">
                    <option value="vermelho">
                    <option value="amarelo">
                    <option value="laranja">
                    <option value="marrom">
                    <option value="branco">
                    <option value="preto">
                    <option value="rosa">
                </datalist>

            </fieldset>

            <button type="submit">Enviar</button>

        </form>
    </section>

</body>
</html>
